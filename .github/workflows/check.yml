name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fonts and icons downloaded for reference renders (packages/engine).
      TUSCHE_CACHE_DIR: ${{ github.workspace }}/.tusche/cache
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .tusche/cache
          key: tusche-cache-${{ hashFiles('fixtures/pen/**/*.pen') }}
          restore-keys: tusche-cache-
      - run: bun run check
